<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect to index.html with the same path for Vue Router
    var path = window.location.pathname
    if (path.endsWith('/')) path += 'index.html'
    else path = path.replace(/\/[^/]*$/, '/index.html')
    window.location.replace(path)
  </script>
</head>
<body></body>
</html>
